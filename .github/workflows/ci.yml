name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck + lint + test across packages/relay and packages/gateway.
      # (e2e scripts are excluded — they need the sibling memorize CLI built.)
      - run: pnpm -r check

  # Verify the deploy image actually builds on PRs (the runtime that ships to
  # Fly), catching Dockerfile/build regressions — e.g. a bad prune or COPY —
  # before merge, not at deploy time.
  docker-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Hub image
        run: docker build -t memorize-hub:ci .

  # Continuous deploy: only after `check` passes on a push to main. PRs run
  # `check` but never this job. Needs a FLY_API_TOKEN repo secret
  # (`fly tokens create deploy` → `gh secret set FLY_API_TOKEN`). App name +
  # config come from fly.toml; --remote-only builds on Fly's builder (no Docker
  # in the runner).
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Confirm the deploy actually produced a working site (a green deploy can
      # still ship a broken boot). Wake the machine, then assert 200s.
      - name: Smoke test the live site
        run: |
          set -euo pipefail
          base="https://memorize-hub-shakystar.fly.dev"
          for i in $(seq 1 20); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$base/healthz" || true)
            [ "$code" = "200" ] && { echo "healthz ok"; break; }
            echo "waiting for healthz ($i): $code"; sleep 3
          done
          # /beta (legacy beta access-request page) was retired with open
          # onboarding (SoT H080); it now 404s by design, so it's not smoked.
          for path in /healthz / /docs; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$base$path")
            echo "$path -> $code"
            [ "$code" = "200" ]
          done
